<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Measurement Converter | KalMarket</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .converter-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .converter-card {
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .converter-title {
            text-align: center;
            margin-bottom: 8px;
            color: #5d2de1;
            font-size: 30px;
        }

        .converter-description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .category-select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 25px;
            background: white;
        }

        .conversion-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .field-group input,
        .field-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8d8d8;
            border-radius: 10px;
            font-size: 17px;
            background: #fff;
        }

        .field-group input:focus,
        .field-group select:focus,
        .category-select:focus {
            outline: none;
            border-color: #5d2de1;
            box-shadow: 0 0 0 3px rgba(93,45,225,0.1);
        }

        .swap-container {
            text-align: center;
            margin: 20px 0;
        }

        .swap-button {
            border: none;
            background: #5d2de1;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .swap-button:hover {
            transform: rotate(180deg);
        }

        .result-box {
            margin-top: 30px;
            padding: 22px;
            background: #f3efff;
            border-radius: 14px;
            text-align: center;
        }

        .result-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: bold;
            color: #5d2de1;
            word-break: break-word;
        }

        .quick-conversions {
            margin-top: 35px;
        }

        .quick-conversions h3 {
            margin-bottom: 15px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .quick-item {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .converter-container {
                margin: 15px auto;
                padding: 10px;
            }

            .converter-card {
                padding: 20px;
            }

            .conversion-row {
                grid-template-columns: 1fr;
            }

            .swap-container {
                margin: 12px 0;
            }

            .quick-grid {
                grid-template-columns: 1fr;
            }

            .converter-title {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="converter-container">

    <div class="converter-card">

        <h1 class="converter-title">
            Measurement Converter
        </h1>

        <p class="converter-description">
            Convert measurements quickly and easily.
        </p>

        <!-- Category -->
        <select id="categorySelect" class="category-select">
            <option value="length">Length</option>
            <option value="weight">Weight / Mass</option>
            <option value="temperature">Temperature</option>
            <option value="area">Area</option>
            <option value="volume">Volume</option>
            <option value="time">Time</option>
            <option value="speed">Speed</option>
            <option value="digital">Digital Storage</option>
        </select>


        <div class="conversion-row">

            <!-- FROM -->
            <div class="field-group">

                <label for="fromValue">
                    From
                </label>

                <input
                    type="number"
                    id="fromValue"
                    placeholder="Enter value"
                    step="any"
                    value="1"
                >

                <select id="fromUnit"></select>

            </div>


            <!-- TO -->
            <div class="field-group">

                <label for="toUnit">
                    To
                </label>

                <select id="toUnit"></select>

            </div>

        </div>


        <!-- Swap -->
        <div class="swap-container">

            <button
                type="button"
                class="swap-button"
                id="swapButton"
                title="Swap units"
            >
                ⇄
            </button>

        </div>


        <!-- Result -->
        <div class="result-box">

            <div class="result-label">
                Result
            </div>

            <div
                id="resultValue"
                class="result-value"
            >
                0
            </div>

        </div>


        <!-- Quick examples -->
        <div class="quick-conversions">

            <h3>
                Common Conversions
            </h3>

            <div
                id="quickConversions"
                class="quick-grid"
            ></div>

        </div>

    </div>

</div>

};


// Temperature is handled separately
const temperatureUnits = {

    celsius: "Celsius",

    fahrenheit: "Fahrenheit",

    kelvin: "Kelvin"

};


const categorySelect =
    document.getElementById("categorySelect");

const fromValue =
    document.getElementById("fromValue");

const fromUnit =
    document.getElementById("fromUnit");

const toUnit =
    document.getElementById("toUnit");

const resultValue =
    document.getElementById("resultValue");

const swapButton =
    document.getElementById("swapButton");

const quickConversions =
    document.getElementById("quickConversions");


// Populate units
function populateUnits() {

    const category = categorySelect.value;

    fromUnit.innerHTML = "";
    toUnit.innerHTML = "";

    if (category === "temperature") {

        Object.entries(temperatureUnits).forEach(
            ([value, name]) => {

                const option1 =
                    document.createElement("option");

                option1.value = value;
                option1.textContent = name;

                const option2 =
                    document.createElement("option");

                option2.value = value;
                option2.textContent = name;

                fromUnit.appendChild(option1);
                toUnit.appendChild(option2);

            }
        );

        fromUnit.value = "celsius";
        toUnit.value = "fahrenheit";

    } else {

        Object.entries(units[category]).forEach(
            ([value, data]) => {

                const option1 =
                    document.createElement("option");

                option1.value = value;
                option1.textContent = data.name;

                const option2 =
                    document.createElement("option");

                option2.value = value;
                option2.textContent = data.name;

                fromUnit.appendChild(option1);
                toUnit.appendChild(option2);

            }
        );

        const available =
            Object.keys(units[category]);

        if (available.length > 1) {
            fromUnit.value = available[0];
            toUnit.value = available[1];
        }

    }

    updateQuickConversions();
    convert();

}


// Temperature conversion
function convertTemperature(value, from, to) {

    let celsius;

    if (from === "celsius") {
        celsius = value;
    }

    else if (from === "fahrenheit") {
        celsius = (value - 32) * 5 / 9;
    }

    else if (from === "kelvin") {
        celsius = value - 273.15;
    }


    if (to === "celsius") {
        return celsius;
    }

    if (to === "fahrenheit") {
        return (celsius * 9 / 5) + 32;
    }

    if (to === "kelvin") {
        return celsius + 273.15;
    }

}


// Main conversion
function convert() {

    const value =
        parseFloat(fromValue.value);

    if (isNaN(value)) {

        resultValue.textContent = "0";
        return;

    }

    const category =
        categorySelect.value;

    let result;


    if (category === "temperature") {

        result = convertTemperature(
            value,
            fromUnit.value,
            toUnit.value
        );

    } else {

        const from =
            units[category][fromUnit.value];

        const to =
            units[category][toUnit.value];

        const baseValue =
            value * from.factor;

        result =
            baseValue / to.factor;

    }


    resultValue.textContent =
        formatNumber(result);

}


// Format result
function formatNumber(number) {

    if (!isFinite(number)) {
        return "0";
    }

    if (Math.abs(number) < 0.000001 && number !== 0) {
        return number.toExponential(6);
    }

    return Number(
        number.toFixed(8)
    ).toLocaleString(
        "en-US",
        {
            maximumFractionDigits: 8
        }
    );

}


// Swap units
swapButton.addEventListener(
    "click",
    () => {

        const oldFrom =
            fromUnit.value;

        fromUnit.value =
            toUnit.value;

        toUnit.value =
            oldFrom;

        convert();

    }
);


// Events
categorySelect.addEventListener(
    "change",
    populateUnits
);

fromValue.addEventListener(
    "input",
    convert
);

fromUnit.addEventListener(
    "change",
    convert
);

toUnit.addEventListener(
    "change",
    convert
);


// Quick conversion examples

            ["1 US Quart", "0.946353 Liters"],

        ],

        time: [

            ["1 KB", "8,000 Bits"],

            ["1 GB", "8,000,000,000 Bits"]
        ]

    };


    examples[category].forEach(
        example => {

            const div =
                document.createElement("div");

            div.className =
                "quick-item";

            div.textContent =
                example[0] + " = " + example[1];

            quickConversions.appendChild(div);

        }
    );

}

populateUnits();
