<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Measurement Converter | KalMarket</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .converter-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .converter-card {
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .converter-title {
            text-align: center;
            margin-bottom: 8px;
            color: #5d2de1;
            font-size: 30px;
        }

        .converter-description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .category-select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 25px;
            background: white;
        }

        .conversion-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .field-group input,
        .field-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8d8d8;
            border-radius: 10px;
            font-size: 17px;
            background: #fff;
        }

        .field-group input:focus,
        .field-group select:focus,
        .category-select:focus {
            outline: none;
            border-color: #5d2de1;
            box-shadow: 0 0 0 3px rgba(93,45,225,0.1);
        }

        .swap-container {
            text-align: center;
            margin: 20px 0;
        }

        .swap-button {
            border: none;
            background: #5d2de1;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .swap-button:hover {
            transform: rotate(180deg);
        }

        .result-box {
            margin-top: 30px;
            padding: 22px;
            background: #f3efff;
            border-radius: 14px;
            text-align: center;
        }

        .result-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: bold;
            color: #5d2de1;
            word-break: break-word;
        }

        .quick-conversions {
            margin-top: 35px;
        }

        .quick-conversions h3 {
            margin-bottom: 15px;
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .quick-item {
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .converter-container {
                margin: 15px auto;
                padding: 10px;
            }

            .converter-card {
                padding: 20px;
            }

            .conversion-row {
                grid-template-columns: 1fr;
            }

            .swap-container {
                margin: 12px 0;
            }

            .quick-grid {
                grid-template-columns: 1fr;
            }

            .converter-title {
                font-size: 25px;
            }
        }
    </style>
</head>

```html
<div class="converter-card">

    <h1
        class="converter-title"
        data-i18n="measurement_converter_title"
    >
        Measurement Converter
    </h1>

    <p
        class="converter-description"
        data-i18n="measurement_converter_description"
    >
        Convert measurements quickly and easily.
    </p>


    <!-- Category -->
    <select
        id="categorySelect"
        class="category-select"
        data-i18n-aria-label="measurement_category"
    >
        <option
            value="length"
            data-i18n="measurement_length"
        >
            Length
        </option>

        <option
            value="weight"
            data-i18n="measurement_weight"
        >
            Weight / Mass
        </option>

        <option
            value="temperature"
            data-i18n="measurement_temperature"
        >
            Temperature
        </option>

        <option
            value="area"
            data-i18n="measurement_area"
        >
            Area
        </option>

        <option
            value="volume"
            data-i18n="measurement_volume"
        >
            Volume
        </option>

        <option
            value="time"
            data-i18n="measurement_time"
        >
            Time
        </option>

        <option
            value="speed"
            data-i18n="measurement_speed"
        >
            Speed
        </option>

        <option
            value="digital"
            data-i18n="measurement_digital_storage"
        >
            Digital Storage
        </option>

        <option
            value="construction"
            data-i18n="measurement_construction"
        >
            Construction / Dimensions
        </option>
    </select>


    <div class="conversion-row">

        <!-- FROM -->
        <div class="field-group">

            <label
                for="fromValue"
                data-i18n="measurement_from"
            >
                From
            </label>

            <input
                type="number"
                id="fromValue"
                data-i18n-placeholder="measurement_enter_value"
                placeholder="Enter value"
                step="any"
                value="1"
            >

            <select
                id="fromUnit"
                data-i18n-aria-label="measurement_from_unit"
            ></select>

        </div>


        <!-- TO -->
        <div class="field-group">

            <label
                for="toUnit"
                data-i18n="measurement_to"
            >
                To
            </label>

            <select
                id="toUnit"
                data-i18n-aria-label="measurement_to_unit"
            ></select>

        </div>

    </div>


    <!-- Swap -->
    <div class="swap-container">

        <button
            type="button"
            class="swap-button"
            id="swapButton"
            data-i18n-title="measurement_swap_units"
            title="Swap units"
        >
            ⇄
        </button>

    </div>


    <!-- Result -->
    <div class="result-box">

        <div
            class="result-label"
            data-i18n="measurement_result"
        >
            Result
        </div>

        <div
            id="resultValue"
            class="result-value"
        >
            0
        </div>

    </div>


    <!-- Construction Converter -->
    <div
        id="constructionSection"
        class="construction-section"
        style="display:none;"
    >

        <h3
            data-i18n="measurement_construction"
        >
            Construction / Dimensions
        </h3>

        <p
            class="construction-description"
            data-i18n="measurement_construction_description"
        >
            Convert feet and inches into inches, centimeters,
            millimeters, meters, or decimal feet.
        </p>


        <div class="construction-inputs">

            <div class="field-group">

                <label
                    for="feetInput"
                    data-i18n="measurement_feet"
                >
                    Feet
                </label>

                <input
                    type="number"
                    id="feetInput"
                    data-i18n-placeholder="measurement_zero"
                    placeholder="0"
                    min="0"
                    step="any"
                >

            </div>


            <div class="field-group">

                <label
                    for="inchesInput"
                    data-i18n="measurement_inches"
                >
                    Inches
                </label>

                <input
                    type="number"
                    id="inchesInput"
                    data-i18n-placeholder="measurement_zero"
                    placeholder="0"
                    min="0"
                    step="any"
                >

            </div>

        </div>


        <div class="construction-results">

            <div class="construction-result">

                <span data-i18n="measurement_total_inches">
                    Total Inches
                </span>

                <strong id="constructionInches">
                    0
                </strong>

            </div>


            <div class="construction-result">

                <span data-i18n="measurement_centimeters">
                    Centimeters
                </span>

                <strong id="constructionCm">
                    0
                </strong>

            </div>


            <div class="construction-result">

                <span data-i18n="measurement_millimeters">
                    Millimeters
                </span>

                <strong id="constructionMm">
                    0
                </strong>

            </div>


            <div class="construction-result">

                <span data-i18n="measurement_meters">
                    Meters
                </span>

                <strong id="constructionMeters">
                    0
                </strong>

            </div>


            <div class="construction-result">

                <span data-i18n="measurement_decimal_feet">
                    Decimal Feet
                </span>

                <strong id="constructionDecimalFeet">
                    0
                </strong>

            </div>

        </div>

    </div>


    <!-- Quick Conversions -->
    <div class="quick-conversions">

        <h3 data-i18n="measurement_common_conversions">
            Common Conversions
        </h3>

        <div
            id="quickConversions"
            class="quick-grid"
        ></div>

    </div>

</div>

 <script src="measurement-converter.js"></script>

</body>
</html>
